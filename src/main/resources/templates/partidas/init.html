<!DOCTYPE html>

<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout}">

	<body>
		<div layout:fragment="content">
			<h1 th:text="#{partida.title}"></h1>
			<form id="iniciarFrm" th:object="${form}" th:action="@{/partida/iniciar}" method="post">
				<input id="username" th:field="*{username}"  />
				<button id="iniciarBtn" type="submit" th:text="#{iniciar.btn}" ></button>
			</form>
		</div>
	</body>
</html>
