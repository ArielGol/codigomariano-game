<!DOCTYPE html>

<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout}">

	<body>
		<div layout:fragment="content">
			<div class="card">
				<div class="card-body">
					<h1 th:text="#{menu.administracion.users}"></h1>
					<form id="userFrm" th:object="${form}" th:action="@{/adm/users/save}" method="post" class="forms-sample">
						<div class="form-group row">
                        	<label for="exampleInputEmail2" class="col-sm-3 col-form-label">Email</label>
                        	<div class="col-sm-9">
                          		<input id="email" type="email" th:field="*{email}" class="form-control"  placeholder="Email">
                        	</div>
                      	</div>	
						<button id="createBtn" type="submit" th:text="#{save.btn}" class="btn btn-primary me-2" ></button>
                      	<button class="btn btn-dark" th:text="#{cancel.btn}"></button>
					</form>
				</div>
			</div>		
		</div>
	</body>
</html>
